# Builds the site and publishes it to GitHub Pages on every push to main.
# The built site is pushed to the `gh-pages` branch, which Pages serves.
# Pages setting on GitHub: Settings > Pages > Source: "Deploy from a branch",
# branch `gh-pages`, folder `/ (root)`.
# To publish again without a new commit: Actions > Deploy site > Run workflow.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time. A deploy that has started is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # gh-pages holds only the latest build, as a single commit.
      - name: Publish dist/ to the gh-pages branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
